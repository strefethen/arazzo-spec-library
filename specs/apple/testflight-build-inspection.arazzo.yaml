arazzo: 1.0.0
info:
  title: TestFlight build inspection
  version: 1.0.0
  description: Six non-atomic read-only observations; no audience, installation, notification delivery or readiness
    judgment.
sourceDescriptions:
- name: apple
  url: ../../fixtures/openapi/apple/testflight.yaml
  type: openapi
components:
  parameters:
    acceptJson:
      name: Accept
      in: header
      value: application/json
    authorization:
      name: Authorization
      in: header
      value: $inputs.authorization
  failureActions:
    stop:
      name: stop-without-fallback
      type: end
workflows:
- workflowId: testflight-build-inspection
  inputs:
    type: object
    properties:
      authorization:
        type: string
        format: password
        writeOnly: true
        description: Externally supplied complete Bearer JWT header value.
      bundle_id:
        type: string
        minLength: 1
        pattern: ^[^,]+$
        description: One exact case-sensitive bundle identifier, without commas.
      marketing_version:
        type: string
        minLength: 1
        pattern: ^[^,]+$
        description: One exact case-sensitive iOS marketing version, without commas.
      build_number:
        type: string
        minLength: 1
        pattern: ^[^,]+$
        description: One exact string build number, without commas.
    required:
    - authorization
    - bundle_id
    - marketing_version
    - build_number
  steps:
  - stepId: resolve-app
    operationId: $sourceDescriptions.apple.apps_getCollection
    parameters:
    - reference: $components.parameters.acceptJson
    - reference: $components.parameters.authorization
    - name: filter[bundleId]
      in: query
      value: $inputs.bundle_id
    - name: limit
      in: query
      value: 2
    - name: fields[apps]
      in: query
      value: name,bundleId
    successCriteria:
    - condition: $statusCode == 200
    - type: regex
      context: $inputs.bundle_id
      condition: ^[^,\s](?:[^,]*[^,\s])?$
    - type: regex
      context: $inputs.marketing_version
      condition: ^[^,\s](?:[^,]*[^,\s])?$
    - type: regex
      context: $inputs.build_number
      condition: ^[^,\s](?:[^,]*[^,\s])?$
    - type: regex
      context: $response.body#/data
      condition: ^\[
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data[:]) == length($.data) && length($.data) == 1]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.links.*) > 0 && match($.links.self, ".+") && (count($.links.next) == 0 || $.links.next
        == null)]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.meta) == 0 || $.meta.paging.limit <= 0 || $.meta.paging.limit > 2 || ($.meta.paging.limit
        == 1 || $.meta.paging.limit == 2)]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.meta) == 0 || (count($.meta.*) > 0 && count($.meta.paging.*) > 0 && ($.meta.paging.limit
        >= 1 && $.meta.paging.limit <= 2) && $.meta.paging.limit >= length($.data) && (count($.meta.paging.total)
        == 0 || $.meta.paging.total == length($.data)) && (count($.meta.paging.nextCursor) == 0 || $.meta.paging.nextCursor
        == null))]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data[0].*) == count($.data[0]["type","id","attributes","relationships","links"]) &&
        count($.data[0].*) > 0]
    - type: jsonpath
      context: $response.body
      condition: $[?$.data[0].type == "apps"]
    - type: jsonpath
      context: $response.body
      condition: $[?match($.data[0].id, "[A-Za-z0-9_-]+")]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data[0].attributes.*) == count($.data[0].attributes["name","bundleId"]) && count($.data[0].attributes.*)
        > 0]
    - type: jsonpath
      context: $response.body
      condition: $[?(count($.data[0].links) == 0 || (count($.data[0].links.*) == count($.data[0].links["self"])
        && count($.data[0].links.*) > 0 && (count($.data[0].links.self) == 0 || (match($.data[0].links.self, "https://api[.]appstoreconnect[.]apple[.]com/[!-~]*")))))]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data[0].relationships) == 0]
    - type: jsonpath
      context: $response.body
      condition: $[?(count($.data[0].attributes.name) == 0 || (match($.data[0].attributes.name, ".+")))]
    - type: jsonpath
      context: $response.body
      condition: $[?match($.data[0].attributes.bundleId, ".+")]
    - condition: $response.body#/data/0/attributes/bundleId == $inputs.bundle_id
    onFailure:
    - reference: $components.failureActions.stop
    outputs:
      selected_app: $response.body#/data/0
      id: $response.body#/data/0/id
  - stepId: resolve-prerelease-version
    operationId: $sourceDescriptions.apple.preReleaseVersions_getCollection
    parameters:
    - reference: $components.parameters.acceptJson
    - reference: $components.parameters.authorization
    - name: filter[app]
      in: query
      value: $steps.resolve-app.outputs.id
    - name: filter[platform]
      in: query
      value: IOS
    - name: filter[version]
      in: query
      value: $inputs.marketing_version
    - name: limit
      in: query
      value: 2
    - name: fields[preReleaseVersions]
      in: query
      value: version,platform,app
    successCriteria:
    - condition: $statusCode == 200
    - type: regex
      context: $response.body#/data
      condition: ^\[
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data[:]) == length($.data) && length($.data) == 1]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.links.*) > 0 && match($.links.self, ".+") && (count($.links.next) == 0 || $.links.next
        == null)]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.meta) == 0 || $.meta.paging.limit <= 0 || $.meta.paging.limit > 2 || ($.meta.paging.limit
        == 1 || $.meta.paging.limit == 2)]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.meta) == 0 || (count($.meta.*) > 0 && count($.meta.paging.*) > 0 && ($.meta.paging.limit
        >= 1 && $.meta.paging.limit <= 2) && $.meta.paging.limit >= length($.data) && (count($.meta.paging.total)
        == 0 || $.meta.paging.total == length($.data)) && (count($.meta.paging.nextCursor) == 0 || $.meta.paging.nextCursor
        == null))]
    - condition: $response.body#/data/0/relationships/app/data/id == $steps.resolve-app.outputs.id
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data[0].*) == count($.data[0]["type","id","attributes","relationships","links"]) &&
        count($.data[0].*) > 0]
    - type: jsonpath
      context: $response.body
      condition: $[?$.data[0].type == "preReleaseVersions"]
    - type: jsonpath
      context: $response.body
      condition: $[?match($.data[0].id, "[A-Za-z0-9_-]+")]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data[0].attributes.*) == count($.data[0].attributes["version","platform"]) && count($.data[0].attributes.*)
        > 0]
    - type: jsonpath
      context: $response.body
      condition: $[?(count($.data[0].links) == 0 || (count($.data[0].links.*) == count($.data[0].links["self"])
        && count($.data[0].links.*) > 0 && (count($.data[0].links.self) == 0 || (match($.data[0].links.self, "https://api[.]appstoreconnect[.]apple[.]com/[!-~]*")))))]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data[0].relationships.*) == count($.data[0].relationships["app"]) && count($.data[0].relationships.*)
        > 0]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data[0].relationships.app.*) == count($.data[0].relationships.app["data","links"]) &&
        count($.data[0].relationships.app.*) > 0]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data[0].relationships.app.data.*) == count($.data[0].relationships.app.data["type","id"])
        && count($.data[0].relationships.app.data.*) > 0]
    - type: jsonpath
      context: $response.body
      condition: $[?$.data[0].relationships.app.data.type == "apps"]
    - type: jsonpath
      context: $response.body
      condition: $[?match($.data[0].relationships.app.data.id, "[A-Za-z0-9_-]+")]
    - type: jsonpath
      context: $response.body
      condition: $[?(count($.data[0].relationships.app.links) == 0 || (count($.data[0].relationships.app.links.*)
        == count($.data[0].relationships.app.links["self","related"]) && count($.data[0].relationships.app.links.*)
        > 0 && (count($.data[0].relationships.app.links.self) == 0 || (match($.data[0].relationships.app.links.self,
        "https://api[.]appstoreconnect[.]apple[.]com/[!-~]*"))) && (count($.data[0].relationships.app.links.related)
        == 0 || (match($.data[0].relationships.app.links.related, "https://api[.]appstoreconnect[.]apple[.]com/[!-~]*")))))]
    - type: jsonpath
      context: $response.body
      condition: $[?match($.data[0].attributes.version, ".+")]
    - type: jsonpath
      context: $response.body
      condition: $[?($.data[0].attributes.platform == "IOS" || $.data[0].attributes.platform == "MAC_OS" || $.data[0].attributes.platform
        == "TV_OS" || $.data[0].attributes.platform == "VISION_OS")]
    - condition: $response.body#/data/0/attributes/version == $inputs.marketing_version
    - condition: $response.body#/data/0/attributes/platform == 'IOS'
    onFailure:
    - reference: $components.failureActions.stop
    outputs:
      selected_prerelease_version: $response.body#/data/0
      id: $response.body#/data/0/id
  - stepId: resolve-build
    operationId: $sourceDescriptions.apple.builds_getCollection
    parameters:
    - reference: $components.parameters.acceptJson
    - reference: $components.parameters.authorization
    - name: filter[app]
      in: query
      value: $steps.resolve-app.outputs.id
    - name: filter[preReleaseVersion]
      in: query
      value: $steps.resolve-prerelease-version.outputs.id
    - name: filter[version]
      in: query
      value: $inputs.build_number
    - name: limit
      in: query
      value: 2
    - name: fields[builds]
      in: query
      value: version,processingState,expired,expirationDate,uploadedDate,buildAudienceType,usesNonExemptEncryption,app,preReleaseVersion
    successCriteria:
    - condition: $statusCode == 200
    - type: regex
      context: $response.body#/data
      condition: ^\[
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data[:]) == length($.data) && length($.data) == 1]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.links.*) > 0 && match($.links.self, ".+") && (count($.links.next) == 0 || $.links.next
        == null)]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.meta) == 0 || $.meta.paging.limit <= 0 || $.meta.paging.limit > 2 || ($.meta.paging.limit
        == 1 || $.meta.paging.limit == 2)]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.meta) == 0 || (count($.meta.*) > 0 && count($.meta.paging.*) > 0 && ($.meta.paging.limit
        >= 1 && $.meta.paging.limit <= 2) && $.meta.paging.limit >= length($.data) && (count($.meta.paging.total)
        == 0 || $.meta.paging.total == length($.data)) && (count($.meta.paging.nextCursor) == 0 || $.meta.paging.nextCursor
        == null))]
    - condition: $response.body#/data/0/relationships/app/data/id == $steps.resolve-app.outputs.id
    - condition: $response.body#/data/0/relationships/preReleaseVersion/data/id == $steps.resolve-prerelease-version.outputs.id
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data[0].*) == count($.data[0]["type","id","attributes","relationships","links"]) &&
        count($.data[0].*) > 0]
    - type: jsonpath
      context: $response.body
      condition: $[?$.data[0].type == "builds"]
    - type: jsonpath
      context: $response.body
      condition: $[?match($.data[0].id, "[A-Za-z0-9_-]+")]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data[0].attributes.*) == count($.data[0].attributes["version","uploadedDate","expirationDate","expired","processingState","buildAudienceType","usesNonExemptEncryption"])
        && count($.data[0].attributes.*) > 0]
    - type: jsonpath
      context: $response.body
      condition: $[?(count($.data[0].links) == 0 || (count($.data[0].links.*) == count($.data[0].links["self"])
        && count($.data[0].links.*) > 0 && (count($.data[0].links.self) == 0 || (match($.data[0].links.self, "https://api[.]appstoreconnect[.]apple[.]com/[!-~]*")))))]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data[0].relationships.*) == count($.data[0].relationships["app","preReleaseVersion"])
        && count($.data[0].relationships.*) > 0]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data[0].relationships.app.*) == count($.data[0].relationships.app["data","links"]) &&
        count($.data[0].relationships.app.*) > 0]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data[0].relationships.app.data.*) == count($.data[0].relationships.app.data["type","id"])
        && count($.data[0].relationships.app.data.*) > 0]
    - type: jsonpath
      context: $response.body
      condition: $[?$.data[0].relationships.app.data.type == "apps"]
    - type: jsonpath
      context: $response.body
      condition: $[?match($.data[0].relationships.app.data.id, "[A-Za-z0-9_-]+")]
    - type: jsonpath
      context: $response.body
      condition: $[?(count($.data[0].relationships.app.links) == 0 || (count($.data[0].relationships.app.links.*)
        == count($.data[0].relationships.app.links["self","related"]) && count($.data[0].relationships.app.links.*)
        > 0 && (count($.data[0].relationships.app.links.self) == 0 || (match($.data[0].relationships.app.links.self,
        "https://api[.]appstoreconnect[.]apple[.]com/[!-~]*"))) && (count($.data[0].relationships.app.links.related)
        == 0 || (match($.data[0].relationships.app.links.related, "https://api[.]appstoreconnect[.]apple[.]com/[!-~]*")))))]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data[0].relationships.preReleaseVersion.*) == count($.data[0].relationships.preReleaseVersion["data","links"])
        && count($.data[0].relationships.preReleaseVersion.*) > 0]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data[0].relationships.preReleaseVersion.data.*) == count($.data[0].relationships.preReleaseVersion.data["type","id"])
        && count($.data[0].relationships.preReleaseVersion.data.*) > 0]
    - type: jsonpath
      context: $response.body
      condition: $[?$.data[0].relationships.preReleaseVersion.data.type == "preReleaseVersions"]
    - type: jsonpath
      context: $response.body
      condition: $[?match($.data[0].relationships.preReleaseVersion.data.id, "[A-Za-z0-9_-]+")]
    - type: jsonpath
      context: $response.body
      condition: $[?(count($.data[0].relationships.preReleaseVersion.links) == 0 || (count($.data[0].relationships.preReleaseVersion.links.*)
        == count($.data[0].relationships.preReleaseVersion.links["self","related"]) && count($.data[0].relationships.preReleaseVersion.links.*)
        > 0 && (count($.data[0].relationships.preReleaseVersion.links.self) == 0 || (match($.data[0].relationships.preReleaseVersion.links.self,
        "https://api[.]appstoreconnect[.]apple[.]com/[!-~]*"))) && (count($.data[0].relationships.preReleaseVersion.links.related)
        == 0 || (match($.data[0].relationships.preReleaseVersion.links.related, "https://api[.]appstoreconnect[.]apple[.]com/[!-~]*")))))]
    - type: jsonpath
      context: $response.body
      condition: $[?match($.data[0].attributes.version, ".+")]
    - type: jsonpath
      context: $response.body
      condition: $[?(count($.data[0].attributes.uploadedDate) == 0 || (match($.data[0].attributes.uploadedDate,
        ".+")))]
    - type: jsonpath
      context: $response.body
      condition: $[?(count($.data[0].attributes.expirationDate) == 0 || (match($.data[0].attributes.expirationDate,
        ".+")))]
    - type: jsonpath
      context: $response.body
      condition: $[?(count($.data[0].attributes.expired) == 0 || (($.data[0].attributes.expired == true || $.data[0].attributes.expired
        == false)))]
    - type: jsonpath
      context: $response.body
      condition: $[?($.data[0].attributes.processingState == "PROCESSING" || $.data[0].attributes.processingState
        == "FAILED" || $.data[0].attributes.processingState == "INVALID" || $.data[0].attributes.processingState
        == "VALID")]
    - type: jsonpath
      context: $response.body
      condition: $[?(count($.data[0].attributes.buildAudienceType) == 0 || (($.data[0].attributes.buildAudienceType
        == "INTERNAL_ONLY" || $.data[0].attributes.buildAudienceType == "APP_STORE_ELIGIBLE")))]
    - type: jsonpath
      context: $response.body
      condition: $[?(count($.data[0].attributes.usesNonExemptEncryption) == 0 || (($.data[0].attributes.usesNonExemptEncryption
        == true || $.data[0].attributes.usesNonExemptEncryption == false)))]
    - condition: $response.body#/data/0/attributes/version == $inputs.build_number
    onFailure:
    - reference: $components.failureActions.stop
    outputs:
      build: $response.body#/data/0
      id: $response.body#/data/0/id
  - stepId: inspect-beta-detail
    operationId: $sourceDescriptions.apple.builds_buildBetaDetail_getToOneRelated
    parameters:
    - reference: $components.parameters.acceptJson
    - reference: $components.parameters.authorization
    - name: id
      in: path
      value: $steps.resolve-build.outputs.id
    - name: fields[buildBetaDetails]
      in: query
      value: autoNotifyEnabled,internalBuildState,externalBuildState,build
    successCriteria:
    - condition: $statusCode == 200
    - condition: $response.body#/data/relationships/build/data/id == $steps.resolve-build.outputs.id
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data.*) == count($.data["type","id","attributes","relationships","links"]) && count($.data.*)
        > 0]
    - type: jsonpath
      context: $response.body
      condition: $[?$.data.type == "buildBetaDetails"]
    - type: jsonpath
      context: $response.body
      condition: $[?match($.data.id, "[A-Za-z0-9_-]+")]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data.attributes.*) == count($.data.attributes["autoNotifyEnabled","internalBuildState","externalBuildState"])
        && count($.data.attributes.*) > 0]
    - type: jsonpath
      context: $response.body
      condition: $[?(count($.data.links) == 0 || (count($.data.links.*) == count($.data.links["self"]) && count($.data.links.*)
        > 0 && (count($.data.links.self) == 0 || (match($.data.links.self, "https://api[.]appstoreconnect[.]apple[.]com/[!-~]*")))))]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data.relationships.*) == count($.data.relationships["build"]) && count($.data.relationships.*)
        > 0]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data.relationships.build.*) == count($.data.relationships.build["data","links"]) &&
        count($.data.relationships.build.*) > 0]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data.relationships.build.data.*) == count($.data.relationships.build.data["type","id"])
        && count($.data.relationships.build.data.*) > 0]
    - type: jsonpath
      context: $response.body
      condition: $[?$.data.relationships.build.data.type == "builds"]
    - type: jsonpath
      context: $response.body
      condition: $[?match($.data.relationships.build.data.id, "[A-Za-z0-9_-]+")]
    - type: jsonpath
      context: $response.body
      condition: $[?(count($.data.relationships.build.links) == 0 || (count($.data.relationships.build.links.*)
        == count($.data.relationships.build.links["self","related"]) && count($.data.relationships.build.links.*)
        > 0 && (count($.data.relationships.build.links.self) == 0 || (match($.data.relationships.build.links.self,
        "https://api[.]appstoreconnect[.]apple[.]com/[!-~]*"))) && (count($.data.relationships.build.links.related)
        == 0 || (match($.data.relationships.build.links.related, "https://api[.]appstoreconnect[.]apple[.]com/[!-~]*")))))]
    - type: jsonpath
      context: $response.body
      condition: $[?(count($.data.attributes.autoNotifyEnabled) == 0 || (($.data.attributes.autoNotifyEnabled ==
        true || $.data.attributes.autoNotifyEnabled == false)))]
    - type: jsonpath
      context: $response.body
      condition: $[?($.data.attributes.internalBuildState == "PROCESSING" || $.data.attributes.internalBuildState
        == "PROCESSING_EXCEPTION" || $.data.attributes.internalBuildState == "MISSING_EXPORT_COMPLIANCE" || $.data.attributes.internalBuildState
        == "READY_FOR_BETA_TESTING" || $.data.attributes.internalBuildState == "IN_BETA_TESTING" || $.data.attributes.internalBuildState
        == "EXPIRED" || $.data.attributes.internalBuildState == "IN_EXPORT_COMPLIANCE_REVIEW")]
    - type: jsonpath
      context: $response.body
      condition: $[?($.data.attributes.externalBuildState == "PROCESSING" || $.data.attributes.externalBuildState
        == "PROCESSING_EXCEPTION" || $.data.attributes.externalBuildState == "MISSING_EXPORT_COMPLIANCE" || $.data.attributes.externalBuildState
        == "READY_FOR_BETA_TESTING" || $.data.attributes.externalBuildState == "IN_BETA_TESTING" || $.data.attributes.externalBuildState
        == "EXPIRED" || $.data.attributes.externalBuildState == "READY_FOR_BETA_SUBMISSION" || $.data.attributes.externalBuildState
        == "IN_EXPORT_COMPLIANCE_REVIEW" || $.data.attributes.externalBuildState == "WAITING_FOR_BETA_REVIEW" ||
        $.data.attributes.externalBuildState == "IN_BETA_REVIEW" || $.data.attributes.externalBuildState == "BETA_REJECTED"
        || $.data.attributes.externalBuildState == "BETA_APPROVED" || $.data.attributes.externalBuildState == "NOT_APPLICABLE")]
    onFailure:
    - reference: $components.failureActions.stop
    outputs:
      beta_detail: $response.body#/data
  - stepId: inspect-beta-review
    operationId: $sourceDescriptions.apple.betaAppReviewSubmissions_getCollection
    parameters:
    - reference: $components.parameters.acceptJson
    - reference: $components.parameters.authorization
    - name: filter[build]
      in: query
      value: $steps.resolve-build.outputs.id
    - name: limit
      in: query
      value: 2
    - name: fields[betaAppReviewSubmissions]
      in: query
      value: betaReviewState,submittedDate,build
    successCriteria:
    - condition: $statusCode == 200
    - type: regex
      context: $response.body#/data
      condition: ^\[
    - type: jsonpath
      context: $response.body
      condition: $[?count($.data[:]) == length($.data) && length($.data) <= 1]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.links.*) > 0 && match($.links.self, ".+") && (count($.links.next) == 0 || $.links.next
        == null)]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.meta) == 0 || $.meta.paging.limit <= 0 || $.meta.paging.limit > 2 || ($.meta.paging.limit
        == 1 || $.meta.paging.limit == 2)]
    - type: jsonpath
      context: $response.body
      condition: $[?count($.meta) == 0 || (count($.meta.*) > 0 && count($.meta.paging.*) > 0 && ($.meta.paging.limit
        >= 1 && $.meta.paging.limit <= 2) && $.meta.paging.limit >= length($.data) && (count($.meta.paging.total)
        == 0 || $.meta.paging.total == length($.data)) && (count($.meta.paging.nextCursor) == 0 || $.meta.paging.nextCursor
