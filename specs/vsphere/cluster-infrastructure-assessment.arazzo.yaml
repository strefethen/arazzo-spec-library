arazzo: 1.0.0
info:
  title: vSphere scoped cluster configuration and inventory assessment
  version: 1.0.0
  description: vSphere 8.0 U3 contract-based; synthetic fixtures; live execution unverified. Session-authenticated
    unique datacenter/cluster selection, returned root pool allocations and children, cluster-filtered
    hosts and VMs, then logout. Configured resources are not utilization, storage/network backing, host
    placement or deployment capacity. No retries or partial success; cancellation can skip logout and
    failure cleanup replaces the original top-level error.
sourceDescriptions:
- name: session
  url: ../../fixtures/openapi/vsphere/session.yaml
  type: openapi
- name: vcenter
  url: ../../fixtures/openapi/vsphere/cluster-infrastructure-assessment.yaml
  type: openapi
components:
  parameters:
    session:
      name: vmware-api-session-id
      in: header
      value: $steps.login.outputs.session_token
workflows:
- workflowId: cluster-infrastructure-assessment
  summary: Assess cluster HA/DRS, root-pool configuration and scoped host/VM inventory; require logout.
  inputs:
    type: object
    required:
    - authorization
    - datacenter_name
    - cluster_name
    properties:
      authorization:
        type: string
        minLength: 1
        writeOnly: true
        format: password
      datacenter_name:
        type: string
        minLength: 1
      cluster_name:
        type: string
        minLength: 1
  steps:
  - stepId: login
    operationId: $sourceDescriptions.session.createSession
    parameters:
    - name: Authorization
      in: header
      value: $inputs.authorization
    successCriteria:
    - condition: $statusCode == 201
    - condition: '!($response.body# == null)'
    - type: regex
      context: $response.body
      condition: ^.+$
    onFailure:
    - name: login-failed-without-body-preview
      type: end
    outputs:
      session_token: $response.body#
  - stepId: resolve-datacenter
    operationId: $sourceDescriptions.vcenter.listDatacenters
    parameters:
    - reference: $components.parameters.session
    - name: names
      in: query
      value: $inputs.datacenter_name
    successCriteria:
    - condition: $statusCode == 200
    - type: jsonpath
      context: $response.body
      condition: $[?length($) == 1 && count($[0]) == 1]
    - type: regex
      context: $response.body#/0/datacenter
      condition: ^\S.*$
    - condition: '!($response.body#/0/datacenter == null)'
    - type: regex
      context: $response.body#/0/name
      condition: ^\S.*$
    - condition: '!($response.body#/0/name == null)'
    - condition: $response.body#/0/name == $inputs.datacenter_name
    - type: jsonpath
      context: $response.body
      condition: $[?match(@.datacenter, ".+") && match(@.name, ".+")]
    onFailure:
    - name: cleanup-after-failure
      type: goto
      stepId: logout-failed
    outputs:
      datacenter: $response.body#/0
      datacenter_id: $response.body#/0/datacenter
  - stepId: resolve-cluster
    operationId: $sourceDescriptions.vcenter.listClusters
    parameters:
    - reference: $components.parameters.session
    - name: names
      in: query
      value: $inputs.cluster_name
    - name: datacenters
      in: query
      value: $steps.resolve-datacenter.outputs.datacenter_id
    successCriteria:
    - condition: $statusCode == 200
    - type: jsonpath
      context: $response.body
      condition: $[?length($) == 1 && count($[0]) == 1]
    - type: jsonpath
      context: $response.body
      condition: $[?match(@.cluster, ".+") && match(@.name, ".+") && (@.ha_enabled == true || @.ha_enabled
        == false) && (@.drs_enabled == true || @.drs_enabled == false)]
    - condition: $response.body#/0/name == $inputs.cluster_name
    onFailure:
    - name: cleanup-after-failure
      type: goto
      stepId: logout-failed
    outputs:
      selected_cluster: $response.body#/0
      cluster_id: $response.body#/0/cluster
      cluster_name: $response.body#/0/name
  - stepId: get-cluster
    operationId: $sourceDescriptions.vcenter.getCluster
    parameters:
    - &id001
      reference: $components.parameters.session
    - name: cluster
      in: path
      value: $steps.resolve-cluster.outputs.cluster_id
    successCriteria:
    - condition: $statusCode == 200
    - type: regex
      context: $response.body
      condition: ^\{
    - type: jsonpath
      context: $response.body
      condition: $[?match($.name, ".+") && match($.resource_pool, ".+")]
    - condition: $response.body#/name == $steps.resolve-cluster.outputs.cluster_name
    onFailure:
    - name: cleanup-after-failure
      type: goto
      stepId: logout-failed
    outputs:
      configuration: $response.body#
      resource_pool_id: $response.body#/resource_pool
  - stepId: get-pool
    operationId: $sourceDescriptions.vcenter.getResourcePool
    parameters:
    - *id001
    - name: resource_pool
      in: path
      value: $steps.get-cluster.outputs.resource_pool_id
    successCriteria:
    - condition: $statusCode == 200
    - type: regex
      context: $response.body
      condition: ^\{
    - type: jsonpath
      context: $response.body
      condition: $[?match($.name, ".+")]
    - type: regex
      context: $response.body#/resource_pools
      condition: ^\[
    - type: jsonpath
      context: $response.body
      condition: $[?count($.resource_pools[?!match(@, ".+")]) == 0]
    - type: jsonpath
      context: $response.body
      condition: $[?!$.cpu_allocation || ($.cpu_allocation.reservation >= 0 && $.cpu_allocation.limit
        >= -1 && ($.cpu_allocation.expandable_reservation == true || $.cpu_allocation.expandable_reservation
        == false) && ($.cpu_allocation.shares.level == "LOW" || $.cpu_allocation.shares.level == "NORMAL"
        || $.cpu_allocation.shares.level == "HIGH" || $.cpu_allocation.shares.level == "CUSTOM") && (!$.cpu_allocation.shares.shares
        || $.cpu_allocation.shares.shares >= 0))]
    - type: jsonpath
      context: $response.body
      condition: $[?!$.memory_allocation || ($.memory_allocation.reservation >= 0 && $.memory_allocation.limit
        >= -1 && ($.memory_allocation.expandable_reservation == true || $.memory_allocation.expandable_reservation
        == false) && ($.memory_allocation.shares.level == "LOW" || $.memory_allocation.shares.level ==
        "NORMAL" || $.memory_allocation.shares.level == "HIGH" || $.memory_allocation.shares.level ==
        "CUSTOM") && (!$.memory_allocation.shares.shares || $.memory_allocation.shares.shares >= 0))]
    onFailure:
    - name: cleanup-after-failure
      type: goto
      stepId: logout-failed
    outputs:
      resource_pool: $response.body#
    onSuccess:
    - name: reject-noninteger-configuration
      type: goto
      stepId: logout-failed
      criteria:
      - &id002
        type: regex
        context: $response.body
        condition: '"(cpu_count|memory_size_MiB|reservation|limit|shares)"\s*:\s*-?[0-9]+(?:\.[0-9]+|[eE][-+]?[0-9]+)'
  - stepId: list-hosts
    operationId: $sourceDescriptions.vcenter.listHosts
    parameters:
    - *id001
    - name: clusters
      in: query
      value: $steps.resolve-cluster.outputs.cluster_id
    successCriteria:
    - condition: $statusCode == 200
    - type: regex
      context: $response.body
      condition: ^\[
    onFailure:
    - name: cleanup-after-failure
      type: goto
      stepId: logout-failed
    outputs:
      hosts: $response.body#
    description: Explicit empty or universally valid inventory proceeds. The first object anchors whole-array
      validation without evaluating the array predicate once per row. Any invalid or unevaluable collection
      goes to failure cleanup.
    onSuccess:
    - name: accept-empty-inventory
      type: goto
      stepId: list-vms
      criteria:
      - type: regex
        context: $response.body
        condition: ^\[\]$
    - name: accept-all-valid-entries
      type: goto
      stepId: list-vms
      criteria:
      - type: jsonpath
        context: $response.body
        condition: $[0][?count($[?!(match(@.host, ".+") && match(@.name, ".+") && (@.connection_state
          == "CONNECTED" || @.connection_state == "DISCONNECTED" || @.connection_state == "NOT_RESPONDING")
          && (!@.power_state || @.power_state == "POWERED_ON" || @.power_state == "POWERED_OFF" || @.power_state
          == "STANDBY"))]) == 0]
    - name: reject-invalid-or-unevaluable-inventory
      type: goto
      stepId: logout-failed
  - stepId: list-vms
    operationId: $sourceDescriptions.vcenter.listVms
    parameters:
    - *id001
    - name: clusters
      in: query
      value: $steps.resolve-cluster.outputs.cluster_id
    successCriteria:
    - condition: $statusCode == 200
    - type: regex
      context: $response.body
      condition: ^\[
    onFailure:
    - name: cleanup-after-failure
      type: goto
      stepId: logout-failed
    outputs:
      vms: $response.body#
    description: Explicit empty or universally valid inventory proceeds. The first object anchors whole-array
      validation without evaluating the array predicate once per row. Any invalid or unevaluable collection
      goes to failure cleanup.
    onSuccess:
    - name: reject-noninteger-configuration
      type: goto
      stepId: logout-failed
      criteria:
      - *id002
    - name: accept-empty-inventory
      type: goto
      stepId: logout
      criteria:
      - type: regex
        context: $response.body
        condition: ^\[\]$
    - name: accept-all-valid-entries
      type: goto
      stepId: logout
      criteria:
      - type: jsonpath
        context: $response.body
        condition: $[0][?count($[?!(match(@.vm, ".+") && match(@.name, ".+") && (@.power_state == "POWERED_ON"
          || @.power_state == "POWERED_OFF" || @.power_state == "SUSPENDED") && (!@.cpu_count || @.cpu_count
          >= 0) && (!@.memory_size_MiB || @.memory_size_MiB >= 0))]) == 0]
    - name: reject-invalid-or-unevaluable-inventory
      type: goto
      stepId: logout-failed
  - stepId: logout
    description: Explicit end avoids falling into failure cleanup.
    operationId: $sourceDescriptions.session.deleteSession
    parameters:
    - &id003
      reference: $components.parameters.session
    successCriteria:
    - condition: $statusCode == 204
    onSuccess:
    - name: end
      type: end
    onFailure:
    - name: end-failed
      type: end
  - stepId: logout-failed
    description: Deliberately fails after cleanup to preserve nonzero outcome; original top-level error
      is replaced.
    operationId: $sourceDescriptions.session.deleteSession
    parameters:
    - *id003
    successCriteria:
    - condition: $statusCode == 204
    - condition: 'false'
    onSuccess:
    - name: end
      type: end
    onFailure:
    - name: end-failed
      type: end
  outputs:
    datacenter: $steps.resolve-datacenter.outputs.datacenter
    selected_cluster: $steps.resolve-cluster.outputs.selected_cluster
    cluster_configuration: $steps.get-cluster.outputs.configuration
    resource_pool_id: $steps.get-cluster.outputs.resource_pool_id
    resource_pool: $steps.get-pool.outputs.resource_pool
    hosts: $steps.list-hosts.outputs.hosts
    vms: $steps.list-vms.outputs.vms
