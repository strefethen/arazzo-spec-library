cases:
- name: happy-path
  workflow: testflight-build-inspection
  inputs: &id005
    authorization: Bearer SYNTHETIC-TESTFLIGHT-SENTINEL
    bundle_id: com.example.corpus
    marketing_version: '1.0'
    build_number: '126'
  requests:
  - &id104
    method: GET
    path: /v1/apps
    query: &id006
      filter[bundleId]: com.example.corpus
      limit: '2'
      fields[apps]: name,bundleId
    headers: &id001
      Accept: application/json
      Authorization: Bearer SYNTHETIC-TESTFLIGHT-SENTINEL
    response: &id103
      status: 200
      fixture: fixtures/responses/apple/testflight-build-inspection/apps.json
  - &id180
    method: GET
    path: /v1/preReleaseVersions
    query: &id017
      filter[app]: app-101
      filter[platform]: IOS
      filter[version]: '1.0'
      limit: '2'
      fields[preReleaseVersions]: version,platform,app
      include: app
      fields[apps]: name,bundleId
    headers: *id001
    response:
      status: 200
      fixture: fixtures/responses/apple/testflight-build-inspection/prerelease-versions.json
  - &id181
    method: GET
    path: /v1/builds
    query: &id019
      filter[app]: app-101
      filter[preReleaseVersion]: pre-201
      filter[version]: '126'
      limit: '2'
      fields[builds]: version,processingState,expired,expirationDate,uploadedDate,buildAudienceType,usesNonExemptEncryption,app,preReleaseVersion
      include: app,preReleaseVersion
      fields[apps]: name,bundleId
      fields[preReleaseVersions]: version,platform
    headers: *id001
    response:
      status: 200
      fixture: fixtures/responses/apple/testflight-build-inspection/builds.json
  - &id182
    method: GET
    path: /v1/builds/build-301/buildBetaDetail
    query: &id021
      fields[buildBetaDetails]: autoNotifyEnabled,internalBuildState,externalBuildState,build
      include: build
      fields[builds]: version
    headers: *id001
    response:
      status: 200
      fixture: fixtures/responses/apple/testflight-build-inspection/beta-detail.json
  - &id183
    method: GET
    path: /v1/betaAppReviewSubmissions
    query: &id023
      filter[build]: build-301
      limit: '2'
      fields[betaAppReviewSubmissions]: betaReviewState,submittedDate,build
      include: build
      fields[builds]: version
    headers: *id001
    response:
      status: 200
      fixture: fixtures/responses/apple/testflight-build-inspection/reviews.json
  - &id184
    method: GET
    path: /v1/betaGroups
    query: &id025
      filter[app]: app-101
      filter[builds]: build-301
      limit: '25'
      sort: name
      fields[betaGroups]: name,isInternalGroup,hasAccessToAllBuilds,publicLinkEnabled,publicLinkLimitEnabled,publicLinkLimit,feedbackEnabled,app
      include: app
      fields[apps]: name,bundleId
    headers: *id001
    response:
      status: 200
      fixture: fixtures/responses/apple/testflight-build-inspection/groups.json
  expect: &id027
    kind: success
    outputs:
      selected_app: &id015
        type: apps
        id: app-101
        attributes: &id010
          bundleId: com.example.corpus
          name: Corpus Sample
      selected_prerelease_version: &id018
        type: preReleaseVersions
        id: pre-201
        attributes: &id036
          version: '1.0'
          platform: IOS
        relationships: &id004
          app: &id002
            data: &id013
              type: apps
              id: app-101
      build: &id020
        type: builds
        id: build-301
        attributes: &id063
          version: '126'
          processingState: VALID
          expired: false
          buildAudienceType: APP_STORE_ELIGIBLE
        relationships: &id064
          app: *id002
          preReleaseVersion: &id066
            data:
              type: preReleaseVersions
              id: pre-201
      beta_detail: &id022
        type: buildBetaDetails
        id: detail-401
        attributes: &id072
          internalBuildState: IN_BETA_TESTING
          externalBuildState: WAITING_FOR_BETA_REVIEW
          autoNotifyEnabled: false
        relationships: &id003
          build:
            data:
              type: builds
              id: build-301
      review_submissions: &id024
      - &id224
        type: betaAppReviewSubmissions
        id: review-501
        attributes: &id083
          betaReviewState: WAITING_FOR_REVIEW
        relationships: *id003
      beta_groups: &id026
      - &id237
        type: betaGroups
        id: group-601
        attributes: &id098
          name: Internal sample
          isInternalGroup: true
          publicLinkLimit: 100
          publicLinkEnabled: false
        relationships: *id004
    assert: '.outputs == {"selected_app": {"type": "apps", "id": "app-101", "attributes": {"bundleId": "com.example.corpus",
      "name": "Corpus Sample"}}, "selected_prerelease_version": {"type": "preReleaseVersions", "id": "pre-201",
      "attributes": {"version": "1.0", "platform": "IOS"}, "relationships": {"app": {"data": {"type": "apps", "id":
      "app-101"}}}}, "build": {"type": "builds", "id": "build-301", "attributes": {"version": "126", "processingState":
      "VALID", "expired": false, "buildAudienceType": "APP_STORE_ELIGIBLE"}, "relationships": {"app": {"data": {"type":
      "apps", "id": "app-101"}}, "preReleaseVersion": {"data": {"type": "preReleaseVersions", "id": "pre-201"}}}},
      "beta_detail": {"type": "buildBetaDetails", "id": "detail-401", "attributes": {"internalBuildState": "IN_BETA_TESTING",
      "externalBuildState": "WAITING_FOR_BETA_REVIEW", "autoNotifyEnabled": false}, "relationships": {"build": {"data":
      {"type": "builds", "id": "build-301"}}}}, "review_submissions": [{"type": "betaAppReviewSubmissions", "id":
      "review-501", "attributes": {"betaReviewState": "WAITING_FOR_REVIEW"}, "relationships": {"build": {"data":
      {"type": "builds", "id": "build-301"}}}}], "beta_groups": [{"type": "betaGroups", "id": "group-601", "attributes":
      {"name": "Internal sample", "isInternalGroup": true, "publicLinkLimit": 100, "publicLinkEnabled": false},
      "relationships": {"app": {"data": {"type": "apps", "id": "app-101"}}}}]}'
    forbidden_output: &id007
    - Bearer SYNTHETIC-TESTFLIGHT-SENTINEL
