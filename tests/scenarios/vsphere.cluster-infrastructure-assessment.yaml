cases:
- name: rich-cluster-report
  workflow: cluster-infrastructure-assessment
  inputs: &id001
    authorization: Basic SYNTHETIC-AUTH-SENTINEL
    datacenter_name: Lab DC
    cluster_name: Compute A
  requests:
  - &id002
    method: POST
    path: /api/session
    query: {}
    headers:
      Authorization: Basic SYNTHETIC-AUTH-SENTINEL
    absent_headers:
    - vmware-api-session-id
    response:
      status: 201
      body: synthetic-session-sentinel-42
  - &id010
    method: GET
    path: /api/vcenter/datacenter
    query:
      names: Lab DC
    headers:
      vmware-api-session-id: synthetic-session-sentinel-42
    absent_headers:
    - Authorization
    response:
      status: 200
      fixture: fixtures/responses/vsphere/cluster-infrastructure-assessment/datacenters.json
  - &id012
    method: GET
    path: /api/vcenter/cluster
    query:
      names: Compute A
      datacenters: datacenter-21
    headers:
      vmware-api-session-id: synthetic-session-sentinel-42
    absent_headers:
    - Authorization
    response:
      status: 200
      fixture: fixtures/responses/vsphere/cluster-infrastructure-assessment/clusters.json
  - &id013
    method: GET
    path: /api/vcenter/cluster/domain-c7
    query: {}
    headers:
      vmware-api-session-id: synthetic-session-sentinel-42
    absent_headers:
    - Authorization
    response:
      status: 200
      fixture: fixtures/responses/vsphere/cluster-infrastructure-assessment/cluster.json
  - &id019
    method: GET
    path: /api/vcenter/resource-pool/resgroup-73
    query: {}
    headers:
      vmware-api-session-id: synthetic-session-sentinel-42
    absent_headers:
    - Authorization
    response:
      status: 200
      fixture: fixtures/responses/vsphere/cluster-infrastructure-assessment/pool.json
  - &id021
    method: GET
    path: /api/vcenter/host
    query:
      clusters: domain-c7
    headers:
      vmware-api-session-id: synthetic-session-sentinel-42
    absent_headers:
    - Authorization
    response:
      status: 200
      fixture: fixtures/responses/vsphere/cluster-infrastructure-assessment/hosts.json
  - &id023
    method: GET
    path: /api/vcenter/vm
    query:
      clusters: domain-c7
    headers:
      vmware-api-session-id: synthetic-session-sentinel-42
    absent_headers:
    - Authorization
    response:
      status: 200
      fixture: fixtures/responses/vsphere/cluster-infrastructure-assessment/vms.json
  - &id003
    method: DELETE
    path: /api/session
    query: {}
    headers:
      vmware-api-session-id: synthetic-session-sentinel-42
    absent_headers:
    - Authorization
    response:
      status: 204
      body: null
  expect:
    kind: success
    outputs:
      datacenter: &id009
        datacenter: datacenter-21
        name: Lab DC
      selected_cluster: &id011
        cluster: domain-c7
        name: Compute A
        ha_enabled: true
        drs_enabled: false
      cluster_configuration:
        name: Compute A
        resource_pool: resgroup-73
      resource_pool_id: resgroup-73
      resource_pool:
        name: Resources
        resource_pools: &id014
        - resgroup-74
        - resgroup-75
        cpu_allocation: &id017
          reservation: 2400
          expandable_reservation: true
          limit: -1
          shares: &id016
            level: NORMAL
        memory_allocation: &id015
          reservation: 4096
          expandable_reservation: false
          limit: 65536
          shares: &id018
            level: CUSTOM
            shares: 12000
      hosts:
      - &id020
        host: host-31
        name: esx-a.example.invalid
        connection_state: CONNECTED
        power_state: POWERED_ON
      - host: host-32
        name: esx-b.example.invalid
        connection_state: DISCONNECTED
      vms:
      - &id022
        vm: vm-42
        name: app-01
        power_state: POWERED_ON
        cpu_count: 4
        memory_size_MiB: 8192
      - vm: vm-43
        name: batch-01
        power_state: POWERED_OFF
        cpu_count: 8
        memory_size_MiB: 16384
      - vm: vm-44
        name: paused-01
        power_state: SUSPENDED
        cpu_count: 2
        memory_size_MiB: 4096
    forbidden_output: &id004
    - SYNTHETIC-AUTH-SENTINEL
    - synthetic-session-sentinel-42
    view_contains:
    - 'HA enabled: true; DRS enabled: false'
    - resgroup-73, requested identity
    - 'Child resource pools: 2'
    - 'Host connection DISCONNECTED: 1'
    - power=unknown
    - 'VM power SUSPENDED: 1'
    - 'Configured CPU: 14 vCPUs known across 3/3 VMs'
    - 'Configured memory: 28672 MiB'
    - reservation=2400 MHz
    - unlimited (-1)
    - shares=unknown
    - shares=12000
