cases:
- name: happy-path-linked-build-is-not-marketing-version
  workflow: release-candidate-inspection
  inputs:
    authorization: Bearer SYNTHETIC-APPLE-SENTINEL
    bundle_id: com.example.corpus
    marketing_version: 1.2.3
  requests:
  - method: GET
    path: /v1/apps
    query:
      filter[bundleId]: com.example.corpus
      limit: '2'
      fields[apps]: name,bundleId
    headers:
      Accept: application/json
      Authorization: Bearer SYNTHETIC-APPLE-SENTINEL
    response:
      status: 200
      fixture: fixtures/responses/apple/release-candidate-inspection/apps.json
  - method: GET
    path: /v1/apps/app-101/appStoreVersions
    query:
      filter[platform]: IOS
      filter[versionString]: 1.2.3
      limit: '2'
      fields[appStoreVersions]: platform,versionString,appVersionState,releaseType
    headers:
      Accept: application/json
      Authorization: Bearer SYNTHETIC-APPLE-SENTINEL
    response:
      status: 200
      fixture: fixtures/responses/apple/release-candidate-inspection/versions.json
  - method: GET
    path: /v1/appStoreVersions/version-201/relationships/build
    query: {}
    headers:
      Accept: application/json
      Authorization: Bearer SYNTHETIC-APPLE-SENTINEL
    response:
      status: 200
      fixture: fixtures/responses/apple/release-candidate-inspection/build-linkage.json
  - method: GET
    path: /v1/builds/build-301
    query:
      fields[builds]: version,uploadedDate,expirationDate,expired,processingState,usesNonExemptEncryption
    headers:
      Accept: application/json
      Authorization: Bearer SYNTHETIC-APPLE-SENTINEL
    response:
      status: 200
      fixture: fixtures/responses/apple/release-candidate-inspection/build.json
  expect:
    kind: success
    outputs:
      selected_app: &id001
        type: apps
        id: app-101
        attributes:
          name: Corpus Sample
          bundleId: com.example.corpus
      selected_version: &id004
        type: appStoreVersions
        id: version-201
        attributes:
          platform: IOS
          versionString: 1.2.3
          appVersionState: PROCESSING_FOR_DISTRIBUTION
          releaseType: AFTER_APPROVAL
      attached_build_id: build-301
      build: &id003
        type: builds
        id: build-301
        attributes:
          version: '42'
          uploadedDate: '2026-10-20T12:00:00Z'
          expirationDate: '2027-10-20T12:00:00Z'
          expired: false
          processingState: VALID
          usesNonExemptEncryption: false
    view_contains:
    - 'App: com.example.corpus (app-101)'
    - 'Version: iOS 1.2.3 (version-201); state PROCESSING_FOR_DISTRIBUTION'
    - 'Attached build: build-301; build number 42; processing VALID'
    - 'Expired: false'
    - 'Uses non-exempt encryption: false'
    - does not establish App Store submission readiness
    forbidden_output:
    - Bearer SYNTHETIC-APPLE-SENTINEL
