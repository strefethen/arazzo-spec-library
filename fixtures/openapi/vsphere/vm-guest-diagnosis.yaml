openapi: 3.0.3
info:
  title: vSphere scoped VM and guest diagnosis subset
  version: 8.0.3
  description: vSphere 8.0 U3 contract-based; synthetic fixtures; live execution unverified. Device maps
    are keyed by device IDs; filesystem is a path-keyed map (confirmed by the pinned 8.0.3.0 SDK). Subset
    schemas preserve additional properties, and are not a full response validator.
servers:
- url: https://vcenter.invalid
paths:
  /api/vcenter/datacenter:
    get:
      operationId: listDatacenters
      externalDocs:
        url: https://developer.broadcom.com/xapis/vsphere-automation-api/8.0.3/vcenter/api/vcenter/datacenter/get/
      parameters:
      - name: vmware-api-session-id
        in: header
        required: true
        schema: &id001
          type: string
      - name: names
        in: query
        style: form
        explode: true
        schema:
          type: array
          items: *id001
      responses:
        '200':
          description: Versioned API response; no /rest value wrapper.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Datacenter'
        '401':
          description: Unauthenticated
        '403':
          description: Unauthorized
        '404':
          description: Resource not found
        '500':
          description: Provider error; collection queries fail if provider hard result cap is exceeded
        '503':
          description: Service unavailable; guest APIs can have no Tools data
  /api/vcenter/vm:
