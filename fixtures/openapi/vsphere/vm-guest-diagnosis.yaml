components:
  schemas:
    Datacenter:
      type: object
      required:
      - datacenter
      - name
      properties:
        datacenter: *id001
        name: *id001
    VmSummary:
      type: object
      required:
      - vm
      - name
      - power_state
      - cpu_count
      - memory_size_MiB
      properties:
        vm: *id001
        name: *id001
        power_state: *id001
        cpu_count: &id002
          type: integer
          format: int64
        memory_size_MiB: *id002
    Disk:
      type: object
      required:
      - label
      - type
      - capacity
      - backing
      properties:
        label: *id001
        type: *id001
        capacity: *id002
        backing:
          type: object
          properties:
            type: *id001
            vmdk_file: *id001
        scsi:
          type: object
          properties:
            bus: *id002
            unit: *id002
    Nic:
      type: object
      required:
      - label
      - type
      - backing
      - state
      - start_connected
      - allow_guest_control
      properties:
        label: *id001
        type: *id001
        mac_address: *id001
        backing:
          type: object
          properties:
            type: *id001
            network: *id001
            network_name: *id001
        state: *id001
        start_connected: &id003
          type: boolean
        allow_guest_control: *id003
    Config:
      type: object
      required:
      - name
      - guest_OS
      - power_state
      - cpu
      - memory
      - disks
      - nics
      properties:
        name: *id001
        guest_OS: *id001
        power_state: *id001
        identity:
          type: object
          properties:
            name: *id001
            bios_uuid: *id001
            instance_uuid: *id001
        cpu:
          type: object
          required:
          - count
          - cores_per_socket
          - hot_add_enabled
          - hot_remove_enabled
          properties:
            count: *id002
            cores_per_socket: *id002
            hot_add_enabled: *id003
            hot_remove_enabled: *id003
        memory:
          type: object
          required:
          - size_MiB
          - hot_add_enabled
          properties:
            size_MiB: *id002
            hot_add_enabled: *id003
        hardware:
          type: object
          properties: {}
        boot:
          type: object
          properties: {}
        boot_devices:
          type: array
          items:
            type: object
            properties: {}
        disks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Disk'
        nics:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Nic'
        cdroms:
          type: object
          additionalProperties:
            type: object
            properties: {}
        floppies:
          type: object
          additionalProperties:
            type: object
            properties: {}
        parallel_ports:
          type: object
          additionalProperties:
            type: object
            properties: {}
        serial_ports:
          type: object
          additionalProperties:
            type: object
            properties: {}
        sata_adapters:
          type: object
          additionalProperties:
            type: object
            properties: {}
        scsi_adapters:
          type: object
          additionalProperties:
            type: object
            properties: {}
        nvme_adapters:
          type: object
          additionalProperties:
            type: object
            properties: {}
    Tools:
      type: object
      required:
      - auto_update_supported
      - upgrade_policy
      - run_state
      properties:
        auto_update_supported: *id003
        upgrade_policy: *id001
        run_state: *id001
        version: *id001
        version_number: *id002
        version_status: *id001
        install_type: *id001
        install_attempt_count: *id002
        error:
          type: object
          properties: {}
    GuestIdentity:
      type: object
      required:
      - name
      - family
      - full_name
      - host_name
      properties:
        name: *id001
        family: *id001
        full_name:
          type: object
          properties:
            id: *id001
            default_message: *id001
            args:
              type: array
              items: *id001
        host_name: *id001
        ip_address: *id001
    Networking:
      type: object
      properties:
        dns_values:
          type: object
          properties:
            host_name: *id001
            domain_name: *id001
        dns:
          type: object
          properties:
            ip_addresses:
              type: array
              items: *id001
            search_domains:
              type: array
              items: *id001
    Interface:
      type: object
      properties:
        mac_address: *id001
        nic: *id001
        dns_values:
          type: object
          properties: {}
        dns:
          type: object
          properties: {}
        wins_servers:
          type: array
          items: *id001
        ip:
          type: object
          properties:
            ip_addresses:
              type: array
              items:
                type: object
                required:
                - ip_address
                - prefix_length
                properties:
                  ip_address: *id001
                  prefix_length: *id002
                  origin: *id001
                  state: *id001
            dhcp:
              type: object
              properties:
                ipv4_enabled: *id003
                ipv6_enabled: *id003
    Route:
      type: object
      required:
      - network
      - prefix_length
      properties:
        network: *id001
        prefix_length: *id002
        gateway_address: *id001
        interface_index: *id002
    Filesystem:
      type: object
      required:
      - capacity
      - free_space
      properties:
        capacity: *id002
        free_space: *id002
        filesystem: *id001
        mappings:
          type: array
          items:
            type: object
            required:
            - disk
            properties:
              disk: *id001
