openapi: 3.0.3
info:
  title: vSphere OVF preparation subset
  version: 8.0.3
  description: vSphere 8.0 U3 contract-based; synthetic fixtures; live execution unverified. Unwrapped
    /api bodies. Get responses do not supply mandatory resource IDs; retain request identities. Optional
    fields remain absent. Additional properties preserved; subset and runtime guards are not full response
    validation.
servers:
- url: https://vcenter.invalid
