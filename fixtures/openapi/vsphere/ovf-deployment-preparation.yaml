components:
  schemas:
    Datacenter:
      type: object
      required:
      - datacenter
      - name
      properties:
        datacenter: &id003
          type: string
        name: *id003
    ClusterSummary:
      type: object
      required:
      - cluster
      - name
      - ha_enabled
      - drs_enabled
      properties:
        cluster: *id001
        name: *id001
        ha_enabled: &id004
          type: boolean
        drs_enabled: *id004
    Cluster:
      type: object
      required:
      - name
      - resource_pool
      properties:
        name: *id001
        resource_pool: *id001
    Shares:
      type: object
      required:
      - level
      properties:
        level:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - CUSTOM
        shares: &id005
          type: integer
          format: int64
    Allocation:
      type: object
      required:
      - reservation
      - expandable_reservation
      - limit
      - shares
      properties:
        reservation: *id005
        expandable_reservation: *id004
        limit: *id005
        shares:
          $ref: '#/components/schemas/Shares'
    ResourcePool:
      type: object
      required:
      - name
      - resource_pools
      properties:
        name: *id001
        resource_pools:
          type: array
          items: *id001
        cpu_allocation:
          $ref: '#/components/schemas/Allocation'
        memory_allocation:
          $ref: '#/components/schemas/Allocation'
    LibraryItem:
      type: object
      required:
      - library_id
      - name
      - content_version
      - metadata_version
      - version
      - description
      - creation_time
      - last_modified_time
      - cached
      properties:
        library_id:
          type: string
        name:
          type: string
        type:
          type: string
        content_version:
          type: string
        metadata_version:
          type: string
        version:
          type: string
        description:
          type: string
        creation_time:
          type: string
        last_modified_time:
          type: string
        last_sync_time:
          type: string
        source_id:
          type: string
        cached:
          type: boolean
        size: &id006
          type: integer
          format: int64
        security_compliance:
          type: boolean
        certificate_verification_info:
          type: object
      description: GET omits id; retain requested identity. Require type ovf for this workflow. size,
        last_sync_time, source_id and certificate metadata may be absent.
    Folder:
      type: object
      required:
      - folder
      - name
      - type
      properties:
        folder:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - DATACENTER
          - DATASTORE
          - HOST
          - NETWORK
          - VIRTUAL_MACHINE
    Datastore:
      type: object
      required:
      - datastore
      - name
      - type
      properties:
        datastore:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - VMFS
          - NFS
          - NFS41
          - CIFS
          - VSAN
          - VFFS
          - VVOL
        capacity: *id006
        free_space: *id006
    Network:
      type: object
      required:
      - network
      - name
      - type
      properties:
        network:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - STANDARD_PORTGROUP
          - DISTRIBUTED_PORTGROUP
          - OPAQUE_NETWORK
    OvfSummary:
      type: object
      required:
      - EULAs
      properties:
        name: *id002
        annotation: *id002
        EULAs:
          type: array
          items: *id002
        networks:
          type: array
          items: *id002
        storage_groups:
          type: array
          items: *id002
        additional_params:
          type: array
          items:
            type: object
            required:
            - type
            properties:
              type:
                type: string
                description: Always present when retrieving OVF package information; subtype identifier,
                  without a local enum or minimum length.
            additionalProperties: true
            externalDocs:
              url: https://vmware.github.io/vsphere-automation-sdk-java/vsphere/8.0.3.0/vcenter-bindings/com/vmware/vcenter/ovf/OvfParams.html#getType--
      description: Each additional_params response object includes the documented OvfParams string type.
        Preserve arbitrary subtype identifiers and unknown properties without guessing subtype attributes.
        Optional absence remains absent and empty arrays are valid. No license acceptance or deployment.
