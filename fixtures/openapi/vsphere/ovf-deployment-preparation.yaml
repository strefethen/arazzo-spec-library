      - name: vmware-api-session-id
        in: header
        required: true
        schema: &id001
          type: string
      - name: names
        in: query
        style: form
        explode: true
        schema:
          type: array
          items: *id001
      responses:
        '200':
          description: Versioned unwrapped response; collection caps are hard failure limits, not pagination.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Datacenter'
        '401':
          description: Unauthenticated
        '403':
          description: Unauthorized
        '404':
          description: Resource not found
        '500':
          description: Provider error, including exceeded collection cap
        '503':
          description: Service unavailable
