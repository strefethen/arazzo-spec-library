components:
  schemas:
    Datacenter:
      type: object
      required:
      - datacenter
      - name
      properties:
        datacenter: &id002
          type: string
        name: *id002
    ClusterSummary:
      type: object
      required:
      - cluster
      - name
      - ha_enabled
      - drs_enabled
      properties:
        cluster: *id001
        name: *id001
        ha_enabled: &id003
          type: boolean
        drs_enabled: *id003
    Cluster:
      type: object
      required:
      - name
      - resource_pool
      properties:
        name: *id001
        resource_pool: *id001
    Shares:
      type: object
      required:
      - level
      properties:
        level:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - CUSTOM
        shares: &id004
          type: integer
          format: int64
    Allocation:
      type: object
      required:
      - reservation
      - expandable_reservation
      - limit
      - shares
      properties:
        reservation: *id004
        expandable_reservation: *id003
        limit: *id004
        shares:
          $ref: '#/components/schemas/Shares'
    ResourcePool:
      type: object
      required:
      - name
      - resource_pools
      properties:
        name: *id001
        resource_pools:
          type: array
          items: *id001
        cpu_allocation:
          $ref: '#/components/schemas/Allocation'
        memory_allocation:
          $ref: '#/components/schemas/Allocation'
    Host:
      type: object
      required:
      - host
      - name
      - connection_state
      properties:
        host: *id001
        name: *id001
        connection_state:
          type: string
          enum:
          - CONNECTED
          - DISCONNECTED
          - NOT_RESPONDING
        power_state:
          type: string
          enum:
          - POWERED_ON
          - POWERED_OFF
          - STANDBY
    VmSummary:
      type: object
      required:
      - vm
      - name
      - power_state
      properties:
        vm: *id001
        name: *id001
        power_state:
          type: string
          enum:
          - POWERED_ON
          - POWERED_OFF
          - SUSPENDED
        cpu_count: *id004
        memory_size_MiB: *id004
