openapi: 3.0.3
info:
  title: Open Library Catalog Subset
  version: 1.0.0
  description: >
    Local GET-only subset, not an upstream OpenAPI publication. Sources:
    https://openlibrary.org/dev/docs/api/search and
    https://openlibrary.org/dev/docs/restful_api. Full work keys are query values.
servers:
  - url: https://openlibrary.org
security: []
paths:
  /search.json:
    get:
      operationId: searchBooks
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
        - {name: fields, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 10}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Bounded work search, ranked by relevance.
          content:
            application/json:
              schema:
                type: object
                required: [numFound, start, docs]
                properties:
                  numFound: {type: integer}
                  start: {type: integer}
                  docs:
                    type: array
                    items:
                      type: object
                      required: [key, title]
                      properties:
                        key: {type: string, pattern: '^/works/OL[0-9]+W$'}
                        title: {type: string}
                        author_name: {type: array, items: {type: string}}
                        edition_count: {type: integer}
        default: {description: Provider error, including rate limiting.}
  /query.json:
    get:
      operationId: queryCatalog
      description: >
        Match stored objects by type and key or works reference. Empty field
        query values request those properties. Limit and offset bound the page;
        this API supplies no total or next link.
      parameters:
        - {name: type, in: query, required: true, schema: {type: string, enum: [/type/work, /type/edition]}}
        - {name: key, in: query, schema: {type: string}}
        - {name: works, in: query, schema: {type: string}}
        - {name: title, in: query, schema: {type: string}}
        - {name: description, in: query, schema: {type: string}}
        - {name: subjects, in: query, schema: {type: string}}
        - {name: isbn_13, in: query, schema: {type: string}}
        - {name: publish_date, in: query, schema: {type: string}}
        - {name: publishers, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 10}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000}}
      responses:
        '200':
          description: Requested fields of matching works or editions.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [key, title]
                  properties:
                    key: {type: string}
                    title: {type: string}
                    description: {}
                    subjects: {type: array, items: {type: string}}
                    isbn_13: {type: array, items: {type: string}}
                    publish_date: {type: string}
                    publishers: {type: array, items: {type: string}}
        default: {description: Provider error, including rate limiting.}
