name: Offline Corpus Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Contributor Tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --only-binary=:all: -r requirements-dev.txt
          command -v jq
          curl --fail --location --silent --show-error --max-time 60 \
            https://github.com/strefethen/arazzo-cli/releases/download/v0.8.2/arazzo-cli-v0.8.2-linux-x86_64 \
            --output "$RUNNER_TEMP/arazzo-cli"
          printf '%s  %s\n' e282f061f1c8c0d3c7ebfd08ab35c38ae1139c51fe9139af942dbdc3c8282a25 "$RUNNER_TEMP/arazzo-cli" | sha256sum --check
          chmod +x "$RUNNER_TEMP/arazzo-cli"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Verify Without Live Provider Calls
        shell: bash
        run: |
          set -euo pipefail
          arazzo-cli --version
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/verify.py
